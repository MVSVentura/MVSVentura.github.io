<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Tablas de Multiplicar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 800px;
            width: 90%;
            min-height: 500px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1 {
            color: #2a5298;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .level-title {
            color: #2a5298;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .level-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            margin: 0 auto;
        }
        .btn {
            background: #ffb366; /* Cambiado a naranja clarito */
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #ff9933;
            transform: translateY(-2px);
        }
        .btn-orange {
            background: #ff8c00;
        }
        .btn-orange:hover {
            background: #e07600;
        }
        .btn-green {
            background: #66bb6a; /* Verde claro */
        }
        .btn-green:hover {
            background: #4caf50;
        }
        .btn-red {
            background: #ef5350; /* Rojo claro */
        }
        .btn-red:hover {
            background: #e53935;
        }
        .btn-light-blue {
            background: #64b5f6; /* Azul claro */
        }
        .btn-light-blue:hover {
            background: #42a5f5;
        }
        .btn-dark-blue {
            background: #1565C0; /* Azul oscuro */
            color: white;
        }
        .btn-dark-blue:hover {
            background: #0D47A1;
        }
        .btn-blue {
            background: #2a5298; /* Azul */
            color: white;
        }
        .btn-blue:hover {
            background: #1e3c72;
        }
        .table-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .game-area {
            margin: 20px 0;
            min-height: 300px;
        }
        .columns {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 20px 0;
        }
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            background: #f0f8ff;
            border: 2px solid #2a5298;
            border-radius: 10px;
            padding: 15px; /* Aumentado el padding */
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            width: 100%; /* Ocupar todo el ancho disponible */
            text-align: center;
            position: relative;
        }
        .card:hover {
            background: #e6f3ff;
            transform: scale(1.05);
        }
        .card.selected {
            background: #2a5298;
            color: white;
        }
        .card.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        .card.hidden {
            background: #ddd;
            color: transparent;
            border-color: #bbb;
        }
        /* Eliminamos las animaciones de las tarjetas en el nivel avanzado */
        .card.showing {
            /* Eliminamos la animación */
        }
        @keyframes showCard {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .card.hiding {
            /* Eliminamos la animación */
        }
        @keyframes hideCard {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.8);
            }
        }
        .question-area {
            background: #f0f8ff;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .question {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .question-counter {
            font-size: 1.2rem;
            color: #2a5298;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .multiplication {
            font-size: 3rem;
            color: #2a5298;
            font-weight: bold;
            margin: 20px 0;
            text-align: center;
        }
        .answer-input {
            font-size: 2rem;
            padding: 10px;
            border: 3px solid #2a5298;
            border-radius: 10px;
            text-align: center;
            width: 150px;
            margin: 20px 0;
        }
        .answer-input.correct {
            background: #4caf50;
            color: white;
        }
        .answer-input.incorrect {
            background: #f44336;
            color: white;
        }
        /* Contenedor para centrar el teclado numérico en el nivel experto */
        .input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px; /* Aumentado el ancho máximo para botones más grandes */
            margin: 0 auto;
        }
        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px; /* Aumentado el espacio entre botones */
            width: 100%;
            max-width: 400px; /* Aumentado el ancho máximo para botones más grandes */
            margin: 20px auto;
        }
        .number-btn {
            background: #f0f8ff;
            border: 2px solid #2a5298;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.4rem; /* Aumentado el tamaño de fuente */
            cursor: pointer;
            transition: all 0.3s ease;
            /* Dimensiones aumentadas para pantallas grandes */
            width: 70px; /* Aumentado de 60px a 70px */
            height: 70px; /* Aumentado de 60px a 70px */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .number-btn:hover {
            background: #2a5298;
            color: white;
        }
        .delete-btn {
            /* Botón de borrado con ancho igual al teclado numérico */
            width: 100%;
            height: 70px; /* Aumentado de 60px a 70px para pantallas grandes */
            margin: 10px auto 0;
            font-size: 1.2rem;
        }
        .control-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .feedback {
            background: #ffeb3b;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }
        .final-screen {
            text-align: center;
            padding: 20px;
        }
        .final-level {
            font-size: 2.5rem;
            color: #2a5298;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .final-table {
            font-size: 1.8rem;
            color: #666;
            margin-bottom: 20px;
        }
        .score {
            font-size: 3rem;
            color: #2a5298;
            font-weight: bold;
            margin: 20px 0;
        }
        .time-info {
            font-size: 1.8rem;
            color: #ff8c00;
            font-weight: bold;
            margin: 10px 0;
        }
        .timer-display {
            font-size: 1.5rem;
            color: #ff8c00;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(255, 140, 0, 0.1);
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ffb366;
        }
        .trophy {
            font-size: 5rem;
            animation: bounce 1s infinite;
            margin-top: 30px; /* Espacio adicional entre el mensaje y el trofeo */
            margin-bottom: 20px;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: firework-explode 1.5s ease-out forwards;
        }
        @keyframes firework-explode {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(var(--y)) translateX(var(--x));
                opacity: 0;
            }
        }
        .logo {
            max-width: 200px;
            margin: 20px auto;
        }
        .credits {
            font-style: italic;
            color: #666;
            margin: 15px 0;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
        }
        .instruction-text {
            font-size: 1.2rem; /* Aumentado el tamaño de fuente */
            color: #1565C0; /* Cambiado a azul oscuro */
            margin-bottom: 15px;
            font-style: italic;
            font-weight: bold;
        }
        .answer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px; /* Aumentado el espacio entre botones */
            margin: 20px 0;
            max-width: 500px; /* Aumentado el ancho máximo */
        }
        /* Estilos específicos para las tarjetas del nivel intermedio */
        .answer-grid .card {
            padding: 25px; /* Aumentado significativamente el padding */
            font-size: 1.4rem; /* Aumentado el tamaño de fuente */
            transition: all 0.3s ease;
        }
        .home-image {
            max-width: 100%;
            margin-top: 30px;
            border-radius: 10px;
        }
        .score-info {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            font-size: 1.1rem;
            color: #333;
        }
        .score-label {
            margin-right: 10px;
            font-weight: bold;
        }
        .score-counter {
            background: #f0f8ff;
            border: 2px solid #2a5298;
            border-radius: 8px;
            padding: 5px 15px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
        .penalty {
            color: #e53935;
        }
        /* Centrar los botones de control en la pantalla de juego */
        .game-screen .control-buttons {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
        }
        
        /* Media queries para ajustar las tarjetas del nivel intermedio según la orientación */
        @media (orientation: landscape) {
            /* Para pantallas en posición horizontal (landscape) */
            .answer-grid .card {
                padding: 28px;
                font-size: 1.5rem;
            }
        }
        
        @media (orientation: portrait) {
            /* Para pantallas en posición vertical (portrait) */
            .answer-grid .card {
                padding: 26px;
                font-size: 1.4rem;
            }
        }
        
        /* Media query para dispositivos móviles */
        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
                margin: 10px;
            }
            
            .columns {
                flex-direction: row; /* Mantener dos columnas en móvil */
                flex-wrap: wrap;
            }
            
            .column {
                flex: 1 1 45%; /* Dos columnas con espacio entre ellas */
                min-width: 45%;
            }
            
            .table-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .multiplication {
                font-size: 2rem;
            }
            
            /* Ajustes para que las tarjetas quepan mejor en móvil */
            .card {
                font-size: 1rem;
                padding: 12px;
            }
            
            /* Ajustes para los botones del nivel experto en dispositivos móviles */
            .number-btn {
                width: 55px; /* Reducido para que quepan en la pantalla */
                height: 55px; /* Reducido para que quepan en la pantalla */
                font-size: 1.2rem; /* Reducido el tamaño de fuente */
                padding: 10px; /* Reducido el padding */
            }
            
            .delete-btn {
                height: 55px; /* Reducido para que quepan en la pantalla */
                font-size: 1.1rem;
            }
            
            /* Ajustes para las tarjetas del nivel intermedio en dispositivos móviles */
            .answer-grid {
                gap: 8px; /* Reducido el espacio entre botones */
                max-width: 90vw; /* Usar el 90% del ancho de la ventana */
                margin: 15px auto;
            }
            
            .answer-grid .card {
                padding: 15px; /* Reducido el padding */
                font-size: 1.2rem; /* Reducido el tamaño de fuente */
            }
            
            /* Ajustes para el botón Comprobar en el nivel experto en pantallas verticales */
            .question-area .control-buttons .btn-blue {
                width: 100%;
                max-width: 300px;
            }
            
            /* Ajustar el ancho máximo del contenedor para móviles */
            .input-container {
                max-width: 320px; /* Reducido para que quepan 5 botones */
            }
            
            .number-pad {
                max-width: 320px; /* Reducido para que quepan 5 botones */
                gap: 8px; /* Reducido el espacio entre botones */
            }
            
            .instruction-text {
                font-size: 1.1rem;
            }
            
            .score-info {
                flex-direction: column;
                gap: 5px;
            }
            
            .timer-display {
                font-size: 1.2rem;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Pantalla inicial -->
        <div id="home-screen" class="screen active">
            <h1>Juego de Tablas de Multiplicar</h1>
            <p class="subtitle">Elige tu nivel de dificultad</p>
            <div class="level-buttons">
                <button class="btn" onclick="selectLevel('inicial')">Inicial</button>
                <button class="btn" onclick="selectLevel('intermedio')">Intermedio</button>
                <button class="btn" onclick="selectLevel('avanzado')">Avanzado</button>
                <button class="btn" onclick="selectLevel('experto')">Experto</button>
            </div>
            <img src="https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/refs/heads/main/Ni%C3%B1os.png" alt="Niños estudiando" class="home-image">
        </div>
        <!-- Pantalla de selección de tabla -->
        <div id="table-select-screen" class="screen">
            <h2 id="level-instruction" class="level-title"></h2>
            <p class="subtitle">Elige la tabla que quieres repasar</p>
            <div class="table-buttons">
                <button class="btn" onclick="startGame(2)">Tabla 2</button>
                <button class="btn" onclick="startGame(3)">Tabla 3</button>
                <button class="btn" onclick="startGame(4)">Tabla 4</button>
                <button class="btn" onclick="startGame(5)">Tabla 5</button>
                <button class="btn" onclick="startGame(6)">Tabla 6</button>
                <button class="btn" onclick="startGame(7)">Tabla 7</button>
                <button class="btn" onclick="startGame(8)">Tabla 8</button>
                <button class="btn" onclick="startGame(9)">Tabla 9</button>
            </div>
        </div>
        <!-- Pantalla de juego -->
        <div id="game-screen" class="screen">
            <div id="timer-display" class="timer-display">Tiempo: 0:00</div>
            <div id="game-area" class="game-area"></div>
            <div class="control-buttons">
                <button class="btn btn-orange" onclick="showConfirmModal('restart'); reproducirSonido('tap')">Reiniciar</button>
                <button class="btn btn-orange" onclick="showConfirmModal('menu'); reproducirSonido('tap')">Volver al menú</button>
            </div>
        </div>
        <!-- Pantalla final -->
        <div id="final-screen" class="screen">
            <div class="final-screen">
                <div id="final-level" class="final-level"></div>
                <div id="final-table" class="final-table"></div>
                <div id="final-score" class="score"></div>
                <div id="final-time" class="time-info"></div>
                <div id="final-message"></div>
                <div id="trophy-area"></div>
                <p class="credits">Creado por Manuel J. Ventura</p>
                <button class="btn btn-orange" onclick="goHome()">Volver a jugar</button>
                <div class="logo">
                    <img src="https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/1e2a36cdd1f8bedcb578a30f5ec5cc8f21c287fe/Siurot.png" alt="Logo del colegio" style="max-width: 100%; height: auto;">
                </div>
            </div>
        </div>
    </div>
    <!-- Modal de confirmación -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <p id="confirm-message"></p>
            <div class="control-buttons">
                <button class="btn btn-green" onclick="confirmAction(true); reproducirSonido('tap')">Sí</button>
                <button class="btn btn-red" onclick="confirmAction(false); reproducirSonido('tap')">No</button>
            </div>
        </div>
    </div>
    <script>
        // Variables globales
        let currentLevel = '';
        let currentTable = 0;
        let gameData = [];
        let attempts = 0;
        let errors = 0;
        let selectedCards = [];
        let currentQuestion = 0;
        let flippedCards = 0;
        let correctPairs = 0;
        let pendingAction = '';
        let selectedCard = null; // Para nivel avanzado
        let waitingForContinue = false; // Para nivel intermedio
        let penaltyPoints = 0; // Puntos de penalización para nivel avanzado
        let startTime = 0; // Tiempo de inicio de la práctica
        let endTime = 0; // Tiempo de fin de la práctica
        let timerInterval = null; // Intervalo para el contador de tiempo
        
        // PASO 1: Crear los objetos Audio con enlaces RAW
        const sonidos = {
            correcto: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/7b86808e254100aeaba6285b3e0b82650ae78055/Correcto.mp3'),
            error: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/7b86808e254100aeaba6285b3e0b82650ae78055/Error.mp3'),
            completado: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/7b86808e254100aeaba6285b3e0b82650ae78055/Completado.mp3'),
            victoria: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/7b86808e254100aeaba6285b3e0b82650ae78055/Termin%C3%A9.mp3'),
            tap: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/37b3eb2da9c15c04dfb71dfe1be60f088ea3cdfc/Tap.mp3'),
            final: new Audio('https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/0b28bf817be00a46c460204ed9127cfd919eea3c/Final.mp3')
        };
        
        // Precargar sonidos
        Object.values(sonidos).forEach(sound => {
            sound.preload = 'auto';
            sound.volume = 0.5;
        });
        
        // PASO 2: Desbloquear audio con el primer clic
        document.addEventListener('click', unlockAudio, { once: true });
        function unlockAudio() {
            Object.values(sonidos).forEach(audio => {
                audio.play().then(() => audio.pause()).catch(() => {});
            });
        }
        
        // PASO 3: Función para reproducir sonidos
        function reproducirSonido(nombre) {
            const audio = sonidos[nombre];
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Error al reproducir audio:", e));
        }
        
        function selectLevel(level) {
            reproducirSonido('tap');
            currentLevel = level;
            
            const instructions = {
                'inicial': 'Empareja cada multiplicación with su resultado',
                'intermedio': 'Elige el resultado correcto para cada multiplicación',
                'avanzado': 'Multiplicaciones visibles, respuestas ocultas. ¡Encuéntralas!',
                'experto': 'Escribe el resultado de cada multiplicación'
            };
            
            document.getElementById('level-instruction').textContent = instructions[level];
            showScreen('table-select-screen');
        }
        
        function startGame(table) {
            reproducirSonido('tap');
            currentTable = table;
            attempts = 0;
            errors = 0;
            selectedCards = [];
            currentQuestion = 0;
            flippedCards = 0;
            correctPairs = 0;
            selectedCard = null; // Resetear para nivel avanzado
            waitingForContinue = false; // Resetear para nivel intermedio
            penaltyPoints = 0; // Resetear penalización para nivel avanzado
            startTime = Date.now(); // Guardar el tiempo de inicio
            
            // Iniciar el contador de tiempo
            startTimer();
            
            generateGameData();
            renderGame();
            showScreen('game-screen');
        }
        
        function startTimer() {
            // Detener cualquier timer existente
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // Actualizar el timer cada segundo
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer(); // Actualizar inmediatamente
        }
        
        function updateTimer() {
            if (!startTime) return;
            
            const currentTime = Date.now();
            const elapsedSeconds = Math.floor((currentTime - startTime) / 1000);
            const minutes = Math.floor(elapsedSeconds / 60);
            const seconds = elapsedSeconds % 60;
            const formattedTime = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            document.getElementById('timer-display').textContent = `Tiempo: ${formattedTime}`;
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function generateGameData() {
            gameData = [];
            for (let i = 1; i <= 10; i++) {
                gameData.push({
                    multiplication: `${currentTable} × ${i}`,
                    result: currentTable * i,
                    matched: false,
                    flipped: false
                });
            }
            
            // Shuffle para todos los niveles
            gameData = shuffleArray(gameData);
        }
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function renderGame() {
            const gameArea = document.getElementById('game-area');
            
            switch (currentLevel) {
                case 'inicial':
                    renderInicialGame(gameArea);
                    break;
                case 'intermedio':
                    renderIntermedioGame(gameArea);
                    break;
                case 'avanzado':
                    renderAvanzadoGame(gameArea);
                    break;
                case 'experto':
                    renderExpertoGame(gameArea);
                    break;
            }
        }
        
        function renderInicialGame(container) {
            const multiplications = [...gameData];
            const results = shuffleArray([...gameData]);
            
            container.innerHTML = `
                <p class="instruction-text">Une las multiplicaciones con su correspondiente resultado</p>
                <div class="columns">
                    <div class="column" id="mult-column">
                        ${multiplications.map((item, index) => 
                            `<div class="card" data-type="mult" data-index="${index}" onclick="selectCard(this, 'mult', ${index})">
                                ${item.multiplication}
                            </div>`
                        ).join('')}
                    </div>
                    <div class="column" id="result-column">
                        ${results.map((item, index) => 
                            `<div class="card" data-type="result" data-value="${item.result}" onclick="selectCard(this, 'result', ${item.result})">
                                ${item.result}
                            </div>`
                        ).join('')}
                    </div>
                </div>
            `;
        }
        
        function renderIntermedioGame(container) {
            if (currentQuestion >= gameData.length) {
                endGame();
                return;
            }
            
            const currentData = gameData[currentQuestion];
            const allResults = gameData.map(item => item.result);
            
            // Mezclar las respuestas para cada pregunta
            const shuffledResults = shuffleArray([...allResults]);
            
            container.innerHTML = `
                <div class="question-area">
                    <div class="question-counter">Pregunta ${currentQuestion + 1}/10</div>
                    <div class="question">¿Cuánto es...?</div>
                    <div class="multiplication">${currentData.multiplication}</div>
                    <div class="answer-grid">
                        ${shuffledResults.map(result => 
                            `<div class="card" data-value="${result}" onclick="selectResult(${result})">
                                ${result}
                            </div>`
                        ).join('')}
                    </div>
                    <div id="feedback"></div>
                    <div id="continue-area"></div>
                </div>
            `;
        }
        
        function renderAvanzadoGame(container) {
            // Crear las multiplicaciones y desordenarlas
            const multiplications = [];
            for (let i = 1; i <= 10; i++) {
                multiplications.push({
                    multiplication: `${currentTable} × ${i}`,
                    result: currentTable * i,
                    matched: false,
                    flipped: true // Siempre visible
                });
            }
            const shuffledMultiplications = shuffleArray([...multiplications]);
            
            // Las respuestas estarán ocultas inicialmente
            const results = [];
            for (let i = 1; i <= 10; i++) {
                results.push({
                    multiplication: `${currentTable} × ${i}`,
                    result: currentTable * i,
                    matched: false,
                    flipped: false // Oculto inicialmente
                });
            }
            
            // Mezclar solo las respuestas
            const shuffledResults = shuffleArray([...results]);
            
            // Calcular oportunidades restantes
            const remainingChances = Math.max(0, 10 - attempts);
            const scoreLabel = attempts <= 10 ? "Oportunidades restantes" : "Penalización";
            const scoreValue = attempts <= 10 ? remainingChances : `-${penaltyPoints}`;
            
            container.innerHTML = `
                <p class="instruction-text">Encuentra la respuesta correcta para cada multiplicación</p>
                <p class="instruction-text">Tienes 10 puntos sin perder puntos</p>
                <div class="score-info">
                    <span class="score-label">${scoreLabel}:</span>
                    <span class="score-counter ${attempts > 10 ? 'penalty' : ''}">${scoreValue}</span>
                </div>
                <div class="columns">
                    <div class="column" id="mult-column">
                        ${shuffledMultiplications.map((item, index) => 
                            `<div class="card" data-type="mult" data-index="${index}" data-value="${item.result}" onclick="selectAdvancedCard(this, 'mult', ${index})">
                                ${item.multiplication}
                            </div>`
                        ).join('')}
                    </div>
                    <div class="column" id="result-column">
                        ${shuffledResults.map((item, index) => 
                            `<div class="card ${item.flipped ? '' : 'hidden'}" data-type="result" data-index="${index}" data-value="${item.result}" onclick="selectAdvancedCard(this, 'result', ${index})">
                                ${item.result}
                            </div>`
                        ).join('')}
                    </div>
                </div>
            `;
        }
        
        function renderExpertoGame(container) {
            if (currentQuestion >= gameData.length) {
                endGame();
                return;
            }
            
            const currentData = gameData[currentQuestion];
            
            container.innerHTML = `
                <div class="question-area">
                    <div class="question-counter">Pregunta ${currentQuestion + 1}/10</div>
                    <div class="question">¿Cuánto es...?</div>
                    <div class="multiplication">${currentData.multiplication}</div>
                    <input type="text" id="answer-input" class="answer-input" readonly>
                    <div class="input-container">
                        <div class="number-pad">
                            ${[1,2,3,4,5,6,7,8,9,0].map(num => 
                                `<button class="number-btn" onclick="inputNumber(${num})">${num}</button>`
                            ).join('')}
                        </div>
                        <button class="number-btn delete-btn" onclick="deleteLastDigit()">Borrar</button>
                    </div>
                    <div class="control-buttons">
                        <button class="btn btn-blue" onclick="checkAnswer()">Comprobar</button>
                    </div>
                    <div id="feedback"></div>
                </div>
            `;
        }
        
        function selectCard(element, type, value) {
            reproducirSonido('tap');
            
            // Deseleccionar otras tarjetas del mismo tipo
            document.querySelectorAll(`[data-type="${type}"].selected`).forEach(card => {
                card.classList.remove('selected');
            });
            
            element.classList.add('selected');
            
            if (type === 'mult') {
                selectedCards[0] = { type, value, element };
            } else {
                selectedCards[1] = { type, value, element };
            }
            
            // Verificar emparejamiento
            if (selectedCards[0] && selectedCards[1]) {
                attempts++;
                const multIndex = selectedCards[0].value;
                const resultValue = selectedCards[1].value;
                
                if (gameData[multIndex].result === resultValue) {
                    // Correcto
                    selectedCards[0].element.classList.add('correct');
                    selectedCards[1].element.classList.add('correct');
                    selectedCards[0].element.onclick = null;
                    selectedCards[1].element.onclick = null;
                    gameData[multIndex].matched = true;
                    correctPairs++;
                    reproducirSonido('correcto');
                    
                    if (correctPairs === gameData.length) {
                        setTimeout(() => {
                            reproducirSonido('completado');
                            endGame();
                        }, 1000);
                    }
                } else {
                    // Incorrecto
                    reproducirSonido('error');
                    setTimeout(() => {
                        selectedCards[0].element.classList.remove('selected');
                        selectedCards[1].element.classList.remove('selected');
                    }, 1000);
                    errors++;
                }
                
                selectedCards = [];
            }
        }
        
        function selectResult(value) {
            // Si estamos esperando a que el usuario presione continuar, ignorar clics
            if (waitingForContinue) {
                return;
            }
            
            reproducirSonido('tap');
            const currentData = gameData[currentQuestion];
            const feedback = document.getElementById('feedback');
            const continueArea = document.getElementById('continue-area');
            
            if (currentData.result === value) {
                reproducirSonido('correcto');
                // Si es correcto, avanzar automáticamente después de un tiempo
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= gameData.length) {
                        reproducirSonido('completado');
                        endGame();
                    } else {
                        renderGame();
                    }
                }, 1000);
            } else {
                reproducirSonido('error');
                errors++;
                // Mostrar feedback con la solución correcta
                feedback.innerHTML = `<div class="feedback">Respuesta correcta: ${currentData.result}</div>`;
                // Mostrar botón de continuar
                continueArea.innerHTML = '<div class="control-buttons"><button class="btn btn-light-blue" onclick="nextQuestion()">Continuar</button></div>';
                waitingForContinue = true;
            }
        }
        
        function selectAdvancedCard(element, type, index) {
            reproducirSonido('tap');
            
            // Si no hay ninguna tarjeta seleccionada
            if (!selectedCard) {
                // Seleccionar la tarjeta
                element.classList.add('selected');
                selectedCard = { type, index, element };
                return;
            }
            
            // Si se selecciona otra tarjeta de la misma columna
            if (selectedCard.type === type) {
                // Deseleccionar la tarjeta anterior y seleccionar la nueva
                selectedCard.element.classList.remove('selected');
                element.classList.add('selected');
                selectedCard = { type, index, element };
                return;
            }
            
            // Obtener los valores de las tarjetas
            const firstCard = selectedCard;
            const secondCard = { type, index, element };
            
            // Determinar cuál es la tarjeta de multiplicación y cuál la de resultado
            let multCard, resultCard;
            if (firstCard.type === 'mult') {
                multCard = firstCard;
                resultCard = secondCard;
            } else {
                multCard = secondCard;
                resultCard = firstCard;
            }
            
            // Obtener el valor de la multiplicación y el resultado
            const multValue = parseInt(multCard.element.getAttribute('data-value'));
            const resultValue = parseInt(resultCard.element.getAttribute('data-value'));
            
            // Quitar la selección de las tarjetas
            multCard.element.classList.remove('selected');
            resultCard.element.classList.remove('selected');
            
            // Si la tarjeta de resultado está oculta, mostrarla sin animación
            if (resultCard.element.classList.contains('hidden')) {
                resultCard.element.classList.remove('hidden');
            }
            
            // Comprobar si es una pareja correcta después de un breve retraso
            setTimeout(() => {
                if (multValue === resultValue) {
                    // Correcto
                    multCard.element.classList.add('correct');
                    resultCard.element.classList.add('correct');
                    
                    // Marcar como emparejadas
                    multCard.element.setAttribute('data-matched', 'true');
                    resultCard.element.setAttribute('data-matched', 'true');
                    
                    correctPairs++;
                    reproducirSonido('correcto');
                    
                    // Comprobar si se han encontrado todas las parejas
                    if (correctPairs === 10) {
                        setTimeout(() => {
                            reproducirSonido('completado');
                            endGame();
                        }, 1000);
                    }
                } else {
                    // Incorrecto
                    // Incrementar el contador de intentos solo para errores
                    attempts++;
                    
                    // La tarjeta de resultado se oculta nuevamente sin animación
                    setTimeout(() => {
                        resultCard.element.classList.add('hidden');
                    }, 800); // Tiempo de visión de 800ms
                    
                    reproducirSonido('error');
                    
                    // Actualizar el contador de oportunidades
                    updateAdvancedGameUI();
                }
                
                // Resetear la selección
                selectedCard = null;
            }, 100);
        }
        
        function updateAdvancedGameUI() {
            // Calcular oportunidades restantes
            const remainingChances = Math.max(0, 10 - attempts);
            const scoreLabel = attempts <= 10 ? "Oportunidades restantes" : "Penalización";
            
            // Si estamos en modo penalización, actualizar penaltyPoints
            if (attempts > 10) {
                penaltyPoints += 10;
            }
            
            const scoreValue = attempts <= 10 ? remainingChances : `-${penaltyPoints}`;
            
            // Actualizar la interfaz para mostrar el contador actualizado
            const scoreInfoElements = document.querySelectorAll('.score-info');
            scoreInfoElements.forEach(element => {
                const labelElement = element.querySelector('.score-label');
                const counterElement = element.querySelector('.score-counter');
                
                if (labelElement) labelElement.textContent = scoreLabel + ':';
                if (counterElement) {
                    counterElement.textContent = scoreValue;
                    if (attempts > 10) {
                        counterElement.classList.add('penalty');
                    } else {
                        counterElement.classList.remove('penalty');
                    }
                }
            });
        }
        
        function inputNumber(num) {
            reproducirSonido('tap');
            const input = document.getElementById('answer-input');
            input.value += num;
        }
        
        function deleteLastDigit() {
            reproducirSonido('tap');
            const input = document.getElementById('answer-input');
            input.value = input.value.slice(0, -1);
        }
        
        function checkAnswer() {
            const input = document.getElementById('answer-input');
            const userAnswer = parseInt(input.value);
            const correctAnswer = gameData[currentQuestion].result;
            const feedback = document.getElementById('feedback');
            
            if (userAnswer === correctAnswer) {
                input.classList.add('correct');
                reproducirSonido('correcto');
                // Si la respuesta es correcta, pasar automáticamente a la siguiente pregunta
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= gameData.length) {
                        reproducirSonido('completado');
                        endGame();
                    } else {
                        renderGame();
                    }
                }, 1000);
            } else {
                input.classList.add('incorrect');
                feedback.innerHTML = `<div class="feedback">Respuesta correcta: ${correctAnswer}</div>`;
                reproducirSonido('error');
                errors++;
                // Si hay error, mostrar el botón de continuar
                document.querySelector('.control-buttons').innerHTML = '<button class="btn btn-light-blue" onclick="nextQuestion()">Continuar</button>';
            }
        }
        
        function nextQuestion() {
            waitingForContinue = false; // Resetear el estado de espera para nivel intermedio
            currentQuestion++;
            if (currentQuestion >= gameData.length) {
                reproducirSonido('completado');
                endGame();
            } else {
                renderGame();
            }
        }
        
        function calculateScore() {
            let score = 0;
            
            switch (currentLevel) {
                case 'inicial':
                    score = Math.round((10 / attempts) * 100);
                    break;
                case 'intermedio':
                    score = Math.max(0, (10 - errors) * 10);
                    break;
                case 'avanzado':
                    // Nueva fórmula: 9 errores sin restar puntos, a partir del error 10 se restan 10 puntos por cada error
                    score = Math.max(0, 100 - penaltyPoints);
                    break;
                case 'experto':
                    score = Math.max(0, (10 - errors) * 10);
                    break;
            }
            
            return Math.min(100, Math.max(0, score));
        }
        
        function endGame() {
            endTime = Date.now(); // Guardar el tiempo de fin
            stopTimer(); // Detener el contador de tiempo
            
            const score = calculateScore();
            
            // Calcular tiempo transcurrido en segundos
            const totalTimeInSeconds = Math.floor((endTime - startTime) / 1000);
            const minutes = Math.floor(totalTimeInSeconds / 60);
            const seconds = totalTimeInSeconds % 60;
            const formattedTime = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            // Mostrar nivel y tabla por separado
            document.getElementById('final-level').textContent = 
                `Nivel ${currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1)}`;
            document.getElementById('final-table').textContent = 
                `Tabla del ${currentTable}`;
            
            document.getElementById('final-score').textContent = `${score} puntos`;
            document.getElementById('final-time').textContent = `Tiempo: ${formattedTime}`;
            
            const trophyArea = document.getElementById('trophy-area');
            const messageArea = document.getElementById('final-message');
            
            if (score === 100) {
                messageArea.innerHTML = '<h3>¡Excelente! ¡Puntuación perfecta!</h3>';
                trophyArea.innerHTML = '<div class="trophy">🏆</div>';
                createFireworks();
                reproducirSonido('victoria');
            } else {
                messageArea.innerHTML = '<h3>¡Buen trabajo! Sigue practicando.</h3>';
                trophyArea.innerHTML = '';
                reproducirSonido('final');
            }
            
            showScreen('final-screen');
        }
        
        function createFireworks() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8c00'];
            
            // Crear múltiples fuegos artificiales
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.5;
                    
                    // Crear partículas para cada fuego artificial
                    for (let j = 0; j < 30; j++) {
                        const particle = document.createElement('div');
                        particle.classList.add('firework');
                        particle.style.left = `${x}px`;
                        particle.style.top = `${y}px`;
                        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        
                        // Dirección aleatoria para cada partícula
                        const angle = Math.random() * Math.PI * 2;
                        const velocity = 50 + Math.random() * 100;
                        particle.style.setProperty('--x', `${Math.cos(angle) * velocity}px`);
                        particle.style.setProperty('--y', `${Math.sin(angle) * velocity}px`);
                        
                        document.body.appendChild(particle);
                        
                        // Eliminar la partícula después de la animación
                        setTimeout(() => particle.remove(), 1500);
                    }
                }, i * 500);
            }
        }
        
        function showConfirmModal(action) {
            pendingAction = action;
            const message = action === 'restart' 
                ? '¿Quieres abandonar y reiniciar el juego?'
                : '¿Quieres abandonar y volver al menú?';
            
            document.getElementById('confirm-message').textContent = message;
            document.getElementById('confirm-modal').classList.add('active');
        }
        
        function confirmAction(confirmed) {
            document.getElementById('confirm-modal').classList.remove('active');
            
            if (confirmed) {
                if (pendingAction === 'restart') {
                    startGame(currentTable);
                } else {
                    goHome();
                }
            }
        }
        
        function goHome() {
            stopTimer(); // Detener el contador al volver al menú
            currentLevel = '';
            currentTable = 0;
            showScreen('home-screen');
        }
        
        function showScreen(screenId) {
            // Si estamos cambiando a una pantalla que no es la de juego, detener el timer
            if (screenId !== 'game-screen') {
                stopTimer();
            }
            
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
